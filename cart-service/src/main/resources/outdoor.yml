server:
  port: ${CART_PORT:8083}
  address: 127.0.0.1
spring:
  application:
    name: shanye-cart
  cloud:
    nacos:
      discovery:
        enabled: false
  datasource:
    url: ${CART_DB_URL:jdbc:h2:file:./.data/cart;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: ${SCHEMA_LOCATIONS:classpath:outdoor-schema.sql}
  jackson:
    default-property-inclusion: non_null
logging:
  level:
    root: INFO
