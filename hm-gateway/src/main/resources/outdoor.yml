server:
  port: ${GATEWAY_PORT:8080}
  address: 127.0.0.1
spring:
  main:
    web-application-type: reactive
  web:
    resources:
      static-locations: file:./frontend/
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: user
          uri: ${USER_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/auth/**,/api/account/**,/api/addresses/**
          filters:
            - StripPrefix=1
        - id: item
          uri: ${ITEM_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/catalog/**,/api/admin/products/**
          filters:
            - StripPrefix=1
        - id: cart
          uri: ${CART_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1
        - id: trade
          uri: ${TRADE_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/orders/**,/api/admin/orders/**,/api/admin/dashboard/**
          filters:
            - StripPrefix=1
        - id: pay
          uri: ${PAY_URL:http://127.0.0.1:8085}
          predicates:
            - Path=/api/admin/payments/**
          filters:
            - StripPrefix=1
